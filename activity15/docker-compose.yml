version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: qdrant-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  web-backend:
    build:
      context: .
      dockerfile: rag-backend/Dockerfile
    container_name: rag-backend
    ports:
      - "5000:5000"
    env_file:
      - ../.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=documents
    depends_on:
      - qdrant
    volumes:
      - ./rag-backend/uploads:/app/agentic-ai/activity13/rag-backend/uploads
    restart: unless-stopped

  web-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina-frontend
    ports:
      - "5173:80"
    depends_on:
      - web-backend
    restart: unless-stopped

volumes:
  qdrant_data:
